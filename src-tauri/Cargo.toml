[package]
name = "time-manager"
version = "0.1.0"
description = "Windows local time manager"
authors = ["WANG"]
edition = "2021"

[lib]
name = "time_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "time-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }
